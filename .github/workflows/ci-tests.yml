name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - '.gitignore'
      - '.gitattributes'
      - '.vscodeignore'
      - '**.md'
  pull_request:

jobs:
  test:
    name: Test
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci
      - name: Compile
        run: npm run compile
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm run test:unit
      - name: Validate grammar
        run: npx --yes vscode-tmgrammar-test@0.0.11 -s source.scp -g syntaxes/scp.tmLanguage.json -t "test/**/*.scp"
        if: runner.os == 'Linux'
